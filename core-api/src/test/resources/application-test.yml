spring:
  datasource:
    url: jdbc:h2:mem:cofrete_core_api;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    schemas: core_api
    default-schema: core_api
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: core_api
  rabbitmq:
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false

cofrete:
  core-api:
    rabbitmq:
      enabled: false

management:
  health:
    rabbit:
      enabled: false
